name: Import complete project snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-project:
    if: contains(github.event.head_commit.message, '[import-project]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and install the exact project snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="01fe77b5ccc191a740a3bf98208e93a562f10c74"
          curl --fail --location --retry 3 \
            "https://github.com/JeremiFerreras/assisted-click/archive/${SOURCE_COMMIT}.zip" \
            --output /tmp/input-buffer-source.zip
          mkdir -p /tmp/input-buffer-source
          unzip -q /tmp/input-buffer-source.zip -d /tmp/input-buffer-source
          SOURCE_DIR="$(find /tmp/input-buffer-source -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${SOURCE_DIR}"

          # Keep this temporary importer workflow untouched; the build workflow
          # is installed separately through the GitHub file API.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          for path in "${SOURCE_DIR}"/* "${SOURCE_DIR}"/.[!.]*; do
            [ -e "${path}" ] || continue
            [ "$(basename "${path}")" = ".github" ] && continue
            cp -a "${path}" .
          done

          # Validate the complete source payload before committing it.
          test -f CMakeLists.txt
          test -f mod.json
          test -f README.md
          test -f src/main.cpp
          test -f src/BufferCore.hpp
          test -f logo.png
          test -f resources/fonts/Poppins-Bold.ttf
          test -f resources/pauseButtonIcon.png
          test -f tests/core_tests.cpp
          FILE_COUNT="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          test "${FILE_COUNT}" = "18"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Input buffer project files"
          git push origin HEAD:main
