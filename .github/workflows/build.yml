name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v4
        with:
          name: Mod Windows
          path: ${{ steps.build.outputs.build-output }}

  core-tests:
    name: Core unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile core tests
        run: g++ -std=c++23 -O2 -Isrc tests/core_tests.cpp -o core_tests

      - name: Run core tests
        run: ./core_tests
