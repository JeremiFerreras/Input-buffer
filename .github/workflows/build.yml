name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Core and profile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile core unit tests
        run: g++ -std=c++20 -O2 -Wall -Wextra -I src tests/core_tests.cpp -o core_tests

      - name: Run core unit tests
        run: ./core_tests

      - name: Compile and run experimental GD-inspired micro-cancel simulations
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I src tests/micro_cancel_sim.cpp -o micro_cancel_sim
          ./micro_cancel_sim

      - name: Compile and run Phase 1 adversarial stress tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I src tests/stress_phase1.cpp -o stress_phase1
          ./stress_phase1

      - name: Run stress tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -D_GLIBCXX_ASSERTIONS -fno-omit-frame-pointer -fsanitize=address,undefined -I src tests/core_tests.cpp -o core_tests_sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ./core_tests_sanitized
          g++ -std=c++20 -O1 -g -Wall -Wextra -D_GLIBCXX_ASSERTIONS -fno-omit-frame-pointer -fsanitize=address,undefined -I src tests/stress_phase1.cpp -o stress_phase1_sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ./stress_phase1_sanitized

      - name: Verify video profile and overflow fallback
        run: python3 tests/verify_video_profile.py

      - name: Validate Geode metadata JSON
        run: python3 -m json.tool mod.json > /dev/null

  build:
    name: Windows Geode build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v4
        with:
          name: Mod Windows
          path: ${{ steps.build.outputs.build-output }}
